<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rise &amp; Pray · Legal</title>
<style>
  :root {
    --ink: #2a2724; --secondary: #6f6862; --bg: #faf7f2;
    --card: #ffffff; --border: #e8e0d5; --accent: #b08968;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece6dd; --secondary: #a89f95; --bg: #1a1815;
      --card: #232019; --border: #35302a; --accent: #c9a37c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4rem 1.25rem; background: var(--bg); color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin: 0 0 .3rem; letter-spacing: -.02em; }
  p.sub { color: var(--secondary); margin: 0 0 2rem; }
  a.doc {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem 1.15rem; margin-bottom: .75rem;
    text-decoration: none; color: var(--ink);
  }
  a.doc span { display: block; color: var(--secondary); font-size: .9rem; margin-top: .15rem; }
  a.doc:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Rise &amp; Pray</h1>
  <p class="sub">Legal documents</p>

  <a class="doc" href="./privacy/">
    Privacy Policy
    <span>What the app collects, and what it doesn't.</span>
  </a>
  <a class="doc" href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">
    Terms of Use
    <span>Apple's standard licensed application end user licence agreement.</span>
  </a>
</main>
</body>
</html>
