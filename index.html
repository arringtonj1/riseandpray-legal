<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rise &amp; Pray</title>
<meta name="description" content="A quiet moment each morning and evening. Daily prayer, scripture and reflection for iPhone.">
<style>
  :root {
    --ink: #2a2724; --secondary: #6f6862; --bg: #faf7f2;
    --card: #ffffff; --border: #e8e0d5; --accent: #b08968;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece6dd; --secondary: #a89f95; --bg: #1a1815;
      --card: #232019; --border: #35302a; --accent: #c9a37c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 5rem 1.25rem 4rem; background: var(--bg); color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main { max-width: 30rem; margin: 0 auto; flex: 1; text-align: center; }
  h1 {
    font: 600 2.6rem/1.1 ui-serif, Georgia, "Times New Roman", serif;
    margin: 0 0 .75rem; letter-spacing: -.02em;
  }
  .tagline { color: var(--secondary); font-size: 1.05rem; margin: 0 0 2.5rem; }
  .verse {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem 1.4rem; margin: 0 0 2.5rem;
  }
  .verse p {
    font: 400 1.1rem/1.6 ui-serif, Georgia, serif; margin: 0 0 .6rem; color: var(--ink);
  }
  .verse cite { font-style: normal; font-size: .85rem; color: var(--secondary); }
  footer {
    margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
    color: var(--secondary); font-size: .85rem; text-align: center;
    max-width: 30rem; margin-left: auto; margin-right: auto; width: 100%;
  }
  footer a { color: var(--secondary); margin: 0 .6rem; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Rise &amp; Pray</h1>
  <p class="tagline">A quiet moment each morning and evening.</p>

  <div class="verse">
    <p>“This is the day which the Lord hath made; we will rejoice and be glad in it.”</p>
    <cite>Psalm 118:24</cite>
  </div>

  <p class="tagline" style="font-size:.95rem">Coming soon to iPhone.</p>
</main>

<footer>
  <a href="./privacy/">Privacy Policy</a>·<a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Terms of Use</a>
</footer>
</body>
</html>
